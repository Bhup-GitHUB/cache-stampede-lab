events { worker_connections 8192; }
http {
  access_log off;
  upstream apps {
    server app1:8080;
    server app2:8080;
    server app3:8080;
    keepalive 256;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream off;
      proxy_read_timeout 5s;
    }
  }
}
