name: cache-stampede-lab
x-app: &app
  build: .
  environment: &env
    MODE: ${MODE:-lease}
    DATABASE_URL: postgres://stampede:stampede@postgres:5432/stampede?sslmode=disable
    REDIS_ADDR: redis:6379
    CACHE_TTL: ${CACHE_TTL:-60s}
    LEASE_TTL: ${LEASE_TTL:-2s}
    QUERY_TIMEOUT: ${QUERY_TIMEOUT:-2s}
    REFRESH_TIMEOUT: ${REFRESH_TIMEOUT:-3s}
    FOLLOWER_TIMEOUT: ${FOLLOWER_TIMEOUT:-3s}
    SIMULATED_DELAY: ${SIMULATED_DELAY:-200ms}
    MAX_DB_CONNS: ${MAX_DB_CONNS:-16}
    MAX_CONCURRENT_DB: ${MAX_CONCURRENT_DB:-32}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stampede
      POSTGRES_PASSWORD: stampede
      POSTGRES_DB: stampede
    ports: ['127.0.0.1:55432:5432']
    volumes: ['./deploy/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stampede']
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 2s
      retries: 30
  app1:
    <<: *app
    environment:
      <<: *env
      INSTANCE: app1
    ports: ['127.0.0.1:18081:8080']
  app2:
    <<: *app
    environment:
      <<: *env
      INSTANCE: app2
    ports: ['127.0.0.1:18082:8080']
  app3:
    <<: *app
    environment:
      <<: *env
      INSTANCE: app3
    ports: ['127.0.0.1:18083:8080']
  lb:
    image: nginx:1.27-alpine
    ports: ['127.0.0.1:18080:8080']
    volumes: ['./deploy/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [app1, app2, app3]
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ['127.0.0.1:19090:9090']
    volumes: ['./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
